##
## docker-compose.prod.yml — PRODUCTION STACK
##
## Runs all services including API and web app in containers.
## Uses pre-built images — build them first with:
##   docker build -f docker/api.Dockerfile -t jobpilot-api .
##   docker build -f docker/web.Dockerfile -t jobpilot-web .
##
## Usage:
##   docker compose -f docker-compose.prod.yml up -d
##

services:
  postgres:
    image: postgres:16-alpine
    container_name: jobpilot_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobpilot_network
    # Postgres should NOT be exposed externally in production
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    container_name: jobpilot_redis_prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobpilot_network
    expose:
      - "6379"

  api:
    image: jobpilot-api:latest
    container_name: jobpilot_api_prod
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jobpilot_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  web:
    image: jobpilot-web:latest
    container_name: jobpilot_web_prod
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - jobpilot_network

volumes:
  postgres_data:
    name: jobpilot_postgres_data_prod
  redis_data:
    name: jobpilot_redis_data_prod

networks:
  jobpilot_network:
    name: jobpilot_network
    driver: bridge
