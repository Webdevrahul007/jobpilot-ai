##
## docker-compose.prod.yml — PRODUCTION STACK
## All 5 services: postgres, redis, api, web, worker
##
## Usage:
##   docker compose -f docker-compose.prod.yml up -d
##   docker compose -f docker-compose.prod.yml logs -f
##   docker compose -f docker-compose.prod.yml down
##
## Build images first:
##   docker build -f docker/api.Dockerfile    -t jobpilot-api:latest .
##   docker build -f docker/web.Dockerfile    -t jobpilot-web:latest .
##   docker build -f docker/worker.Dockerfile -t jobpilot-worker:latest .
##

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: jobpilot_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - jobpilot_network
    expose:
      - "5432"

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: jobpilot_redis_prod
    restart: always
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - jobpilot_network
    expose:
      - "6379"

  # ── API ─────────────────────────────────────────────────────────────────────
  api:
    image: jobpilot-api:latest
    container_name: jobpilot_api_prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: ${CORS_ORIGIN}
      PLAYWRIGHT_HEADLESS: "true"
      PLAYWRIGHT_SESSION_DIR: /app/.sessions
      RESUME_FILE_PATH: /app/resumes/Rahul_Jangid_Resume.pdf
      LOG_DIR: /app/logs
    volumes:
      - sessions_data:/app/.sessions
      - resume_data:/app/resumes
      - api_logs:/app/logs
      - screenshots_data:/app/screenshots
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jobpilot_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/v1/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Web Dashboard ────────────────────────────────────────────────────────────
  web:
    image: jobpilot-web:latest
    container_name: jobpilot_web_prod
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_DEV_USER_ID: ${NEXT_PUBLIC_DEV_USER_ID}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - jobpilot_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Queue Worker ─────────────────────────────────────────────────────────────
  worker:
    image: jobpilot-worker:latest
    container_name: jobpilot_worker_prod
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PLAYWRIGHT_HEADLESS: "true"
      PLAYWRIGHT_SESSION_DIR: /app/.sessions
      RESUME_FILE_PATH: /app/resumes/Rahul_Jangid_Resume.pdf
      SCREENSHOT_DIR: /app/screenshots
      LOG_DIR: /app/logs
    volumes:
      - sessions_data:/app/.sessions      # shared with api — same session files
      - resume_data:/app/resumes          # shared with api — same resume PDF
      - worker_logs:/app/logs
      - screenshots_data:/app/screenshots
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jobpilot_network

volumes:
  postgres_data:    { name: jobpilot_postgres_prod }
  redis_data:       { name: jobpilot_redis_prod }
  sessions_data:    { name: jobpilot_sessions_prod }
  resume_data:      { name: jobpilot_resume_prod }
  screenshots_data: { name: jobpilot_screenshots_prod }
  api_logs:         { name: jobpilot_api_logs_prod }
  worker_logs:      { name: jobpilot_worker_logs_prod }

networks:
  jobpilot_network:
    name: jobpilot_network
    driver: bridge
